<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Familjen</title>
  <meta name="description" content="Familjens kalender – idag, vecka, viktigt och barnen.">
  <meta name="theme-color" content="#1a1917">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Familjen">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <h1 id="view-title">Idag</h1>
      <div class="topbar-sub"><span id="today-label"></span> <span class="demo-pill" title="Påhittad exempeldata">Demo</span></div>
    </div>
  </header>

  <main id="view" class="view" aria-live="polite"></main>

  <nav class="tabbar" aria-label="Huvudmeny">
    <button class="tab" data-tab="idag"><span class="tab-ico" aria-hidden="true">☀️</span><span>Idag</span></button>
    <button class="tab" data-tab="vecka"><span class="tab-ico" aria-hidden="true">🗓️</span><span>Vecka</span></button>
    <button class="tab" data-tab="highlights"><span class="tab-ico" aria-hidden="true">⭐</span><span>Highlights</span><span class="tab-badge" id="hl-badge" hidden></span></button>
    <button class="tab" data-tab="barn"><span class="tab-ico" aria-hidden="true">🧒</span><span>Barn</span></button>
  </nav>

  <script src="data.js?v=9"></script>
  <script src="app.js?v=9"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(() => {});
        let refreshing = false;
        navigator.serviceWorker.addEventListener('controllerchange', () => {
          if (refreshing) return;
          refreshing = true;
          location.reload();
        });
      });
    }
  </script>
</body>
</html>
